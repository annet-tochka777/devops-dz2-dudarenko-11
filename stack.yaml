# Стек домашнего задания № 2. Всё, что в угловых скобках, заменить
# значениями своего варианта. Тег образа не пишется: его подставляет
# deploy.sh через переменную VERSION.
services:
  web:
    image: localhost:6011/dudarenko-11/probe:${VERSION}
    environment:
      MARKER: datalab
      APP_PORT: "5011"
      DATABASE_URL: postgresql://postgres:lab@db:5432/lab
    ports:
      - "8033:5011"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5011/notes')"]
      interval: 3s
      retries: 3
    networks: [net]
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
        monitor: 20s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    volumes:
      - data:/var/lib/postgresql/data
    networks: [net]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "postgres"]
      interval: 2s
      retries: 30

networks:
  net:
    ipam:
      config:
        - subnet: 10.31.0.0/24

volumes:
  data:
